      value: '<h2>How Climate Change Affects People and Animals</h2>'
      format: content_format
  field_simplified_text:
    -
      value: "<h3>How Climate Change Affects Our Health</h3><p>Climate change is making people sicker. As the Earth gets hotter, we see more heatwaves. These can make people very ill, especially older folks and kids. Big storms and floods caused by climate change can also spread diseases and hurt our hospitals.</p><h3>Food and Farming Problems</h3><p>Climate change is bad for growing food. Hotter weather and weird rain patterns make it harder for farmers to grow crops. This means less food and higher prices. Poor countries that depend on farming are hit the hardest.</p><h3>Money Troubles</h3><p>Climate change costs a lot of money. We have to spend more to fix damage from big storms. Some jobs, like tourism and fishing, are suffering because of climate change. This means less money for many people.</p><h3>Animals and Nature in Danger</h3><p>Climate change is hard on animals. It changes where they can live and find food. Some animals can't adapt fast enough and might die out. This hurts the balance of nature.</p><h3>Oceans in Trouble</h3><p>Our oceans are getting warmer and more acidic. This kills coral reefs, which are homes for many sea creatures. It's also harder for some sea animals to make their shells. This affects the whole ocean ecosystem.</p><h3>Ice Melting, Animals Suffering</h3><p>As ice melts in the cold parts of Earth, animals like polar bears and penguins suffer. They need ice to hunt and live on. With less ice, they have to work harder to survive.</p><h3>Coastal Areas at Risk</h3><p>Rising sea levels are bad news for people living near the coast. Floods can damage homes and make drinking water salty. Poor communities often get hurt the most because they can't easily move or protect themselves.</p><h3>Fishing Problems</h3><p>Climate change is making it harder to catch fish. Fish are moving to new places as the water changes. This is bad for people who depend on fishing for food and jobs.</p><h3>What We Can Do</h3><p>To fight climate change, everyone needs to work together. We need to use less energy that makes the air dirty. We should use more clean energy like solar and wind power. We also need to find ways to protect people and nature from the changes that are already happening.</p>"
      format: content_format
