      value: '<h2>Understanding Tariffs: The Basics of Trade Taxes</h2>'
      format: content_format
  field_simplified_text:
    -
      value: "<h3>What Are Tariffs?</h3><p>Tariffs are taxes on goods brought into a country. They've been used for a long time in trade between countries. Tariffs can help protect local businesses, but they can also cause problems.</p><h3>Why Do Countries Use Tariffs?</h3><p>Countries use tariffs for different reasons:</p><p>1. To protect new industries that are just starting</p><p>2. To keep important industries safe for national security</p><p>3. To save jobs and help workers</p><p>4. To get other countries to make better trade deals</p><p>5. To make money for the government</p><h3>Problems with Tariffs</h3><p>Tariffs can also cause problems:</p><p>1. Things cost more for people to buy</p><p>2. Resources aren't used in the best way</p><p>3. Other countries might fight back with their own tariffs</p><p>4. Companies that sell things to other countries can get hurt</p><p>5. It can be harder for companies to make and sell their products</p><h3>What Happens When Countries Use Tariffs?</h3><p>When countries use tariffs, it can help some businesses and workers. But it can also make things cost more for everyone. Sometimes, tariffs can lead to big fights between countries over trade.</p><h3>Other Ways to Help Local Businesses</h3><p>Instead of tariffs, countries can use other ways to help their businesses:</p><p>1. Give money directly to companies</p><p>2. Limit how much can be brought in from other countries</p><p>3. Make rules that are hard for other countries to follow</p><p>4. Help workers learn new skills if they lose their jobs</p><h3>What Should Countries Do?</h3><p>Using tariffs is tricky. They can help in the short term, but they can cause problems in the long run. Countries need to think carefully about using tariffs and find ways to work together with other countries.</p>"
